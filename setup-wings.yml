## Pterodactyl Wings host. Baseline + Wings daemon. Run against hosts
## in the [wings] group via `task deploy:wings`, which passes
## `-e target_hosts=wings`.
##
## After the playbook completes, create the node in the Pterodactyl
## panel, copy its generated config to /etc/pterodactyl/config.yml on
## the host, then `systemctl start wings`.
---
- import_playbook: playbooks/debian-init.yml
- import_playbook: playbooks/debian-basic.yml
- import_playbook: playbooks/debian-network.yml
- import_playbook: playbooks/debian-docker.yml
- import_playbook: playbooks/debian-portainer-agent.yml
- import_playbook: playbooks/debian-cockpit.yml
- import_playbook: playbooks/debian-wings.yml
