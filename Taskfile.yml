version: "3"

vars:
  COMPOSE: docker compose
  RUN: docker compose run --rm ansible
  PLAYBOOK: setup-debian.yml
  INVENTORY: inventory

tasks:
  default:
    silent: true
    cmds:
      - task --list

  init:
    desc: >
      One-time bootstrap. Builds the ansible runner container image and
      installs the Ansible collections listed in requirements.yml into
      ./collections (mounted into the container at runtime). Run this
      after a fresh clone or whenever requirements.yml changes.
    cmds:
      - task: build:container
      - task: install:collections

  build:container:
    desc: >
      Build the ansible runner Docker image used by every other task.
      The image is defined by Dockerfile (debian:trixie + ansible +
      sshpass) and is referenced from docker-compose.yml.
    cmds:
      - "{{.COMPOSE}} build ansible"

  install:collections:
    desc: >
      Install ansible-galaxy collections (ansible.posix,
      community.general, community.docker) from requirements.yml into
      ./collections inside the container. Idempotent — re-run after
      editing requirements.yml.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-galaxy collection install -r requirements.yml -p ./collections"

  lint:
    desc: >
      Run ansible-lint across every playbook in the repo (top-level
      setup-*.yml plus playbooks/*.yml). Catches deprecated module
      names, unsafe shell usage, missing become, and style issues.
      Non-zero exit means lint failed.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-lint setup-debian.yml setup-docker.yml setup-gpu.yml setup-wings.yml playbooks/"

  syntax:
    desc: >
      Syntax-check every top-level playbook without contacting any
      host. Fast (a few seconds) and runs offline. Catches YAML and
      Ansible-language errors that lint won't.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-debian.yml --syntax-check"
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-docker.yml --syntax-check"
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-gpu.yml --syntax-check"
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-wings.yml --syntax-check"

  check:
    desc: >
      Umbrella offline check — runs lint + syntax. Use as a pre-push
      gate; no host contact, no real changes. For check-mode against
      live hosts use `task test` instead.
    cmds:
      - task: lint
      - task: syntax

  molecule:test:
    desc: >
      Full Molecule run for the default scenario: create a Debian
      systemd container, converge it with the container-safe baseline
      phases, assert idempotence, run verify.yml, then destroy.
      Requires the host docker socket (already mounted in
      docker-compose.yml). Run `task molecule:converge` instead if you
      want to keep the target around for poking at.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule test"

  molecule:converge:
    desc: >
      Create the molecule target container and run converge.yml
      against it, but don't destroy when done. Re-run to test
      idempotence. Pair with `molecule:login` to inspect state and
      `molecule:destroy` to clean up.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule converge"

  molecule:verify:
    desc: >
      Run verify.yml against the live molecule target (must already
      be converged). Quick way to iterate on assertions without
      re-running the full baseline.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule verify"

  molecule:login:
    desc: >
      Open a shell inside the running molecule target container.
      Useful for inspecting state mid-debug (the target is a sibling
      container of the ansible runner, both on the host docker daemon).
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule login"

  molecule:destroy:
    desc: >
      Tear down the molecule target container. Safe to run even if
      no scenario is currently up.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule destroy"

  test:
    desc: >
      Dry-run the full playbook against the inventory in --check mode.
      Connects to the target host over SSH but makes no changes; reports
      what would change. Requires SSH access to the host(s) in
      ./inventory and the user_ssh_key secret to exist at ~/.ssh/id_rsa.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} {{.PLAYBOOK}} --check --diff {{.CLI_ARGS}}"

  ping:
    desc: >
      Verify SSH connectivity and become privileges to every host in
      ./inventory. Run this first when debugging — if ping fails, no
      playbook will succeed.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible -i {{.INVENTORY}} all -m ping {{.CLI_ARGS}}"

  facts:
    desc: >
      Gather and print Ansible facts for every host. Useful for
      discovering the real network interface name
      (ansible_default_ipv4.interface) before setting network_interface
      in group_vars/init.yml.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible -i {{.INVENTORY}} all -m setup {{.CLI_ARGS}}"

  shell:
    desc: >
      Open an interactive bash shell inside the ansible runner container
      with the repo mounted at /ansible. Use for ad-hoc ansible / ssh
      commands.
    deps: [build:container]
    cmds:
      - "{{.COMPOSE}} run --rm ansible bash"

  deploy:all:
    desc: >
      Run the complete setup-debian.yml playbook against every host in
      ./inventory. This is the production deploy — it WILL modify the
      target host (users, SSH config, static IP, Docker, Portainer
      Agent, Cockpit). Run `task test` first.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} {{.PLAYBOOK}} --diff {{.CLI_ARGS}}"

  deploy:init:
    desc: >
      Run only the APT init playbook (remove CD-ROM source, apt update +
      dist-upgrade). Useful as a first step on a freshly installed
      Debian 13 host.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-init.yml --diff {{.CLI_ARGS}}"

  deploy:basic:
    desc: >
      Run only the basic-setup playbook (hostname, admin user + SSH key,
      unattended-upgrades, timezone, ufw + SSH allow). Idempotent.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-basic.yml --diff {{.CLI_ARGS}}"

  deploy:network:
    desc: >
      Run only the static-IP / ifupdown playbook. DANGER — a wrong value
      in group_vars/init.yml will lock you out of SSH; have console
      access ready. Change takes effect on next reboot.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-network.yml --diff {{.CLI_ARGS}}"

  deploy:docker:
    desc: >
      Run only the Docker install playbook (Docker CE repo, engine,
      compose plugin, daemon.json with log rotation, docker group).
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-docker.yml --diff {{.CLI_ARGS}}"

  deploy:portainer-agent:
    desc: >
      Run only the Portainer Agent playbook. Renders
      /opt/portainer-agent/docker-compose.yml on the host and brings up
      the agent on <host>:9001 so a central Portainer server can manage
      it as a remote environment.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-portainer-agent.yml --diff {{.CLI_ARGS}}"

  deploy:cockpit:
    desc: >
      Run only the Cockpit playbook. Installs Cockpit, enables
      cockpit.socket, opens ufw 9090/tcp. Access at https://<host>:9090.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-cockpit.yml --diff {{.CLI_ARGS}}"

  deploy:docker:
    desc: >
      Run setup-docker.yml against every host in the [docker] group:
      baseline (init/basic/network/docker/portainer-agent/cockpit). No
      role-specific phase — this is the "plain docker host" deploy.
      Idempotent.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-docker.yml -e target_hosts=docker --diff {{.CLI_ARGS}}"

  deploy:gpu:
    desc: >
      Run setup-gpu.yml against every host in the [gpu] group: baseline
      + NVIDIA driver + nvidia-container-toolkit wired into Docker.
      Assumes Proxmox-level PCI passthrough is already done. A reboot
      is required after the first run before nvidia-smi works.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-gpu.yml -e target_hosts=gpu --diff {{.CLI_ARGS}}"

  deploy:gpu-only:
    desc: >
      Run only the GPU phase (debian-gpu.yml) against the [gpu] group.
      Skips the baseline — use this when you've already deployed the
      role once and only want to update the driver / container toolkit.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-gpu.yml -e target_hosts=gpu --diff {{.CLI_ARGS}}"

  deploy:wings:
    desc: >
      Run setup-wings.yml against every host in the [wings] group:
      baseline + Pterodactyl Wings daemon, systemd unit, ufw rules for
      8080/tcp (API) and 2022/tcp (SFTP). The node's config.yml is
      generated by the Pterodactyl panel and must be dropped onto the
      host at /etc/pterodactyl/config.yml before wings will start.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-wings.yml -e target_hosts=wings --diff {{.CLI_ARGS}}"

  deploy:wings-only:
    desc: >
      Run only the Wings phase (debian-wings.yml) against the [wings]
      group. Skips the baseline — use this when you've already deployed
      the role once and only want to update the wings binary or unit.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-wings.yml -e target_hosts=wings --diff {{.CLI_ARGS}}"

  clean:
    desc: >
      Stop and remove the ansible runner container. Leaves the built
      image and the ./collections cache intact.
    cmds:
      - "{{.COMPOSE}} down --remove-orphans"

  clean:all:
    desc: >
      Stop & remove the runner container, delete the built image, and
      remove the installed ./collections directory. Forces a full
      rebuild on the next `task init`.
    cmds:
      - "{{.COMPOSE}} down --rmi local --volumes --remove-orphans"
      - rm -rf ./collections
