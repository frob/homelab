version: "3"

vars:
  COMPOSE: docker compose
  RUN: docker compose run --rm ansible
  PLAYBOOK: setup-debian.yml
  INVENTORY: inventory
  # Ansible Vault password file on the HOST. Mounted into the runner as
  # the `vault_pass` secret by docker-compose.yml, which is where
  # ansible.cfg reads it from. Lives outside the repo on purpose — this
  # is a public repo and a password file has no business in the tree,
  # gitignored or not. Override the host path with ANSIBLE_VAULT_PASS.
  VAULT_PASS_FILE: '{{.HOME}}/.config/homelab/vault-pass'
  # vault:edit writes group_vars/all/vault.yml into the bind-mounted
  # repo while the runner is root, which would leave a root-owned file
  # in your tree that you'd need sudo to edit or commit. Running the
  # container as your uid instead doesn't work — uid 1000 has no
  # /etc/passwd entry in the image and ansible calls
  # getpass.getuser(), which raises. So stay root and hand the file
  # back afterwards, taking the target owner from the mount itself.
  CHOWN_TO_MOUNT: 'chown $(stat -c %u:%g /ansible)'
  # Molecule scenario under molecule/<name>/. `default` covers the
  # baseline; `jellyfin` covers the Jellyfin role phase. Override per
  # invocation: `task molecule:test SCENARIO=jellyfin`.
  SCENARIO: default

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # Unlike every other task here, this runs a HOST tool (the `claude` CLI)
  # interactively rather than a container — hence `interactive: true`, which
  # hands it the TTY. The container rule still applies to the work it does:
  # the primer tells it to drive everything through this Taskfile.
  claude:start:
    desc: >
      Start Claude Code seeded with a primer about this repo — the hard rules
      (containers only, everything through the Taskfile, public repo, git is
      hands-off), the layout, the SSH/Vault credential model, which test tasks
      to run, and the gotchas that waste a session. Pass a task for the session
      after `--`, e.g. `task claude:start -- 'add a phase for restic backups'`.
      Extra claude flags go in CLAUDE_ARGS, e.g.
      `CLAUDE_ARGS=--model=opus task claude:start`.
    interactive: true
    cmds:
      - ./scripts/claude-start.sh {{.CLI_ARGS}}

  init:
    desc: >
      One-time bootstrap. Creates the Ansible Vault password file if
      absent, builds the ansible runner container image, and installs
      the Ansible collections listed in requirements.yml into
      ./collections (mounted into the container at runtime). Run this
      after a fresh clone or whenever requirements.yml changes.
    cmds:
      - task: vault:init
      - task: build:container
      - task: install:collections

  vault:init:
    desc: >
      Generate the Ansible Vault password file at
      ~/.config/homelab/vault-pass (mode 0600) if it doesn't exist.
      Writes 48 random bytes, base64 — nothing to invent or remember,
      and stronger than a chosen passphrase since it's only ever read
      by the runner. Back it up: lose it and group_vars/all/vault.yml
      is unrecoverable.

      Two reasons this must exist before anything else runs, both of
      which fail confusingly otherwise: compose fails container create
      on a missing secret file, and ansible rejects an EMPTY vault
      password file on every invocation even when nothing is
      encrypted. A dep of build:container, so it self-heals.
    status:
      - test -s {{.VAULT_PASS_FILE}}
    cmds:
      - mkdir -p $(dirname {{.VAULT_PASS_FILE}})
      - install -m 0600 /dev/null {{.VAULT_PASS_FILE}}
      - head -c 48 /dev/urandom | base64 -w0 > {{.VAULT_PASS_FILE}}
      - 'echo "Generated {{.VAULT_PASS_FILE}} — back it up; group_vars/all/vault.yml cannot be decrypted without it."'

  vault:edit:
    desc: >
      Create or edit the encrypted become credentials at
      group_vars/all/vault.yml. Put the admin user's sudo password in
      it as `ansible_become_password: <password>`. The file is safe to
      commit to this public repo — the ciphertext is useless without
      {{.VAULT_PASS_FILE}}, which never enters the tree.
    deps: [build:container]
    cmds:
      - "{{.COMPOSE}} run --rm ansible sh -c 'if test -f group_vars/all/vault.yml; then ansible-vault edit group_vars/all/vault.yml; else ansible-vault create group_vars/all/vault.yml; fi && {{.CHOWN_TO_MOUNT}} group_vars/all/vault.yml'"

  vault:view:
    desc: >
      Decrypt and print group_vars/all/vault.yml. Read-only; use
      `vault:edit` to change it.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-vault view group_vars/all/vault.yml"

  build:container:
    desc: >
      Build the ansible runner Docker image used by every other task.
      The image is defined by Dockerfile (debian:trixie + ansible +
      sshpass) and is referenced from docker-compose.yml.
    deps: [vault:init]
    cmds:
      - "{{.COMPOSE}} build ansible"

  install:collections:
    desc: >
      Install ansible-galaxy collections (ansible.posix,
      community.general, community.docker) from requirements.yml into
      ./collections inside the container. Idempotent — re-run after
      editing requirements.yml.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-galaxy collection install -r requirements.yml -p ./collections"

  lint:
    desc: >
      Run ansible-lint across every playbook in the repo (top-level
      setup-*.yml plus playbooks/*.yml). Catches deprecated module
      names, unsafe shell usage, missing become, and style issues.
      Non-zero exit means lint failed.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-lint setup-debian.yml setup-docker.yml setup-gpu.yml setup-wings.yml setup-jellyfin.yml playbooks/"

  syntax:
    desc: >
      Syntax-check every top-level playbook without contacting any
      host. Fast (a few seconds) and runs offline. Catches YAML and
      Ansible-language errors that lint won't.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-debian.yml --syntax-check"
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-docker.yml --syntax-check"
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-gpu.yml --syntax-check"
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-wings.yml --syntax-check"
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-jellyfin.yml --syntax-check"

  check:
    desc: >
      Umbrella offline check — runs lint + syntax. Use as a pre-push
      gate; no host contact, no real changes. For check-mode against
      live hosts use `task test` instead.
    cmds:
      - task: lint
      - task: syntax

  molecule:test:
    desc: >
      Full Molecule run for one scenario (default: `default`): create a
      Debian systemd container, converge it, assert idempotence, run
      verify.yml, then destroy. Pick the scenario with
      `SCENARIO=jellyfin`. Requires the host docker socket (already
      mounted in docker-compose.yml). Run `task molecule:converge`
      instead if you want to keep the target around for poking at.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule test -s {{.SCENARIO}}"

  molecule:test:all:
    desc: >
      Run every Molecule scenario in sequence — the baseline
      (`default`) and the Jellyfin role phase (`jellyfin`). This is the
      one to run before pushing a change to a playbook or its
      group_vars.
    cmds:
      - task: molecule:test
        vars: {SCENARIO: default}
      - task: molecule:test
        vars: {SCENARIO: jellyfin}

  molecule:converge:
    desc: >
      Create the molecule target container and run converge.yml
      against it, but don't destroy when done. Re-run to test
      idempotence. Pair with `molecule:login` to inspect state and
      `molecule:destroy` to clean up.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule converge -s {{.SCENARIO}}"

  molecule:verify:
    desc: >
      Run verify.yml against the live molecule target (must already
      be converged). Quick way to iterate on assertions without
      re-running the full baseline.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule verify -s {{.SCENARIO}}"

  molecule:login:
    desc: >
      Open a shell inside the running molecule target container.
      Useful for inspecting state mid-debug (the target is a sibling
      container of the ansible runner, both on the host docker daemon).
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule login -s {{.SCENARIO}}"

  molecule:destroy:
    desc: >
      Tear down the molecule target container. Safe to run even if
      no scenario is currently up.
    deps: [build:container]
    cmds:
      - "{{.RUN}} molecule destroy -s {{.SCENARIO}}"

  test:
    desc: >
      Dry-run the full playbook against the inventory in --check mode.
      Connects to the target host over SSH but makes no changes; reports
      what would change. Requires SSH access to the host(s) in
      ./inventory and the user_ssh_key secret to resolve (see
      ANSIBLE_SSH_KEY in docker-compose.yml).
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} {{.PLAYBOOK}} --check --diff {{.CLI_ARGS}}"

  ping:
    desc: >
      Verify SSH connectivity and become privileges to every host in
      ./inventory. Run this first when debugging — if ping fails, no
      playbook will succeed.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible -i {{.INVENTORY}} all -m ping {{.CLI_ARGS}}"

  adhoc:
    desc: >
      Run an ad-hoc ansible module against inventory hosts. Pass the
      module and args after `--`, e.g.
      `task adhoc -- -m command -a uptime --limit 192.168.1.50`.
      Connects as the remote_user from ansible.cfg; add --become as
      needed.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible -i {{.INVENTORY}} all {{.CLI_ARGS}}"

  facts:
    desc: >
      Gather and print Ansible facts for every host. Useful for
      discovering the real network interface name
      (ansible_default_ipv4.interface) before setting network_interface
      in group_vars/init.yml.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible -i {{.INVENTORY}} all -m setup {{.CLI_ARGS}}"

  shell:
    desc: >
      Open an interactive bash shell inside the ansible runner container
      with the repo mounted at /ansible. Use for ad-hoc ansible / ssh
      commands.
    deps: [build:container]
    cmds:
      - "{{.COMPOSE}} run --rm ansible bash"

  deploy:all:
    desc: >
      Run the complete setup-debian.yml playbook against every host in
      ./inventory. This is the production deploy — it WILL modify the
      target host (users, SSH config, static IP, Docker, Portainer
      Agent, Cockpit). Run `task test` first.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} {{.PLAYBOOK}} --diff {{.CLI_ARGS}}"

  deploy:init:
    desc: >
      Run only the APT init playbook (remove CD-ROM source, apt update +
      dist-upgrade). Useful as a first step on a freshly installed
      Debian 13 host.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-init.yml --diff {{.CLI_ARGS}}"

  deploy:basic:
    desc: >
      Run only the basic-setup playbook (hostname, admin user + SSH key,
      unattended-upgrades, timezone, ufw + SSH allow). Idempotent.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-basic.yml --diff {{.CLI_ARGS}}"

  deploy:network:
    desc: >
      Run only the static-IP / ifupdown playbook. DANGER — a wrong value
      in group_vars/init.yml will lock you out of SSH; have console
      access ready. Change takes effect on next reboot.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-network.yml --diff {{.CLI_ARGS}}"

  deploy:docker:
    desc: >
      Run only the Docker install playbook (Docker CE repo, engine,
      compose plugin, daemon.json with log rotation, docker group).
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-docker.yml --diff {{.CLI_ARGS}}"

  deploy:portainer-agent:
    desc: >
      Run only the Portainer Agent playbook. Renders
      /opt/portainer-agent/docker-compose.yml on the host and brings up
      the agent on <host>:9001 so a central Portainer server can manage
      it as a remote environment.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-portainer-agent.yml --diff {{.CLI_ARGS}}"

  deploy:cockpit:
    desc: >
      Run only the Cockpit playbook. Installs Cockpit, enables
      cockpit.socket, opens ufw 9090/tcp. Access at https://<host>:9090.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-cockpit.yml --diff {{.CLI_ARGS}}"

  deploy:docker:
    desc: >
      Run setup-docker.yml against every host in the [docker] group:
      baseline (init/basic/network/docker/portainer-agent/cockpit). No
      role-specific phase — this is the "plain docker host" deploy.
      Idempotent.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-docker.yml -e target_hosts=docker --diff {{.CLI_ARGS}}"

  deploy:gpu:
    desc: >
      Run setup-gpu.yml against every host in the [gpu] group: baseline
      + NVIDIA driver + nvidia-container-toolkit wired into Docker.
      Assumes Proxmox-level PCI passthrough is already done. A reboot
      is required after the first run before nvidia-smi works.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-gpu.yml -e target_hosts=gpu --diff {{.CLI_ARGS}}"

  deploy:gpu-only:
    desc: >
      Run only the GPU phase (debian-gpu.yml) against the [gpu] group.
      Skips the baseline — use this when you've already deployed the
      role once and only want to update the driver / container toolkit.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-gpu.yml -e target_hosts=gpu --diff {{.CLI_ARGS}}"

  deploy:wings:
    desc: >
      Run setup-wings.yml against every host in the [wings] group:
      baseline + Pterodactyl Wings daemon, systemd unit, ufw rules for
      8080/tcp (API) and 2022/tcp (SFTP). The node's config.yml is
      generated by the Pterodactyl panel and must be dropped onto the
      host at /etc/pterodactyl/config.yml before wings will start.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-wings.yml -e target_hosts=wings --diff {{.CLI_ARGS}}"

  deploy:wings-only:
    desc: >
      Run only the Wings phase (debian-wings.yml) against the [wings]
      group. Skips the baseline — use this when you've already deployed
      the role once and only want to update the wings binary or unit.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-wings.yml -e target_hosts=wings --diff {{.CLI_ARGS}}"

  deploy:jellyfin:
    desc: >
      Run setup-jellyfin.yml against every host in the [jellyfin] group:
      baseline + NFS media mount (when jellyfin_media_nfs) + the
      Jellyfin container (frob/cuddlefish) serving media read-only from
      /srv/media + Syncthing keeping the library synced/backed up. Set
      jellyfin_enable_gpu in group_vars/jellyfin.yml to also run the
      NVIDIA phase for hardware transcoding.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} setup-jellyfin.yml -e target_hosts=jellyfin --diff {{.CLI_ARGS}}"

  deploy:jellyfin-only:
    desc: >
      Run only the Jellyfin phase (debian-jellyfin.yml) against the
      [jellyfin] group. Skips the baseline — use this to roll out a new
      frob/cuddlefish image or compose change on an already-deployed
      host.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-jellyfin.yml -e target_hosts=jellyfin --diff {{.CLI_ARGS}}"

  deploy:nfs-media:
    desc: >
      Run only the NFS media-mount phase (debian-nfs-media.yml) against
      the [jellyfin] group. Installs nfs-common and mounts
      jellyfin_nfs_src at the media dir (persisted in /etc/fstab).
      Refuses to run until jellyfin_nfs_src is set to a real export in
      group_vars/jellyfin.yml.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-nfs-media.yml -e target_hosts=jellyfin --diff {{.CLI_ARGS}}"

  deploy:syncthing:
    desc: >
      Run only the Syncthing phase (debian-syncthing.yml) against the
      [jellyfin] group. Renders /opt/syncthing/docker-compose.yml,
      brings the container up with the media dir mounted read-write at
      /media, and opens ufw 8384/tcp (GUI), 22000/tcp+udp (sync),
      21027/udp (discovery). Folder + device pairing happens in the GUI.
    deps: [build:container]
    cmds:
      - "{{.RUN}} ansible-playbook -i {{.INVENTORY}} playbooks/debian-syncthing.yml -e target_hosts=jellyfin --diff {{.CLI_ARGS}}"

  clean:
    desc: >
      Stop and remove the ansible runner container. Leaves the built
      image and the ./collections cache intact.
    cmds:
      - "{{.COMPOSE}} down --remove-orphans"

  clean:all:
    desc: >
      Stop & remove the runner container, delete the built image, and
      remove the installed ./collections directory. Forces a full
      rebuild on the next `task init`.
    cmds:
      - "{{.COMPOSE}} down --rmi local --volumes --remove-orphans"
      - rm -rf ./collections
