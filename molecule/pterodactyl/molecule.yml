---
# Molecule scenario: the Pterodactyl Panel role phase.
#
# Same reasoning as the `jellyfin` scenario, which this is modelled on:
# debian-pterodactyl-panel.yml renders its compose file as a
# Jinja heredoc, and this one is bigger — three services, two of them
# carrying interpolated passwords, and an env block where a single
# mis-indented line silently moves a variable out of the service. A typo
# there produces text that looks fine in a diff and leaves the stack
# down on a live deploy. This scenario renders it in a container and
# parses the result.
#
# Run with `task molecule:test SCENARIO=pterodactyl`.

driver:
  name: docker

platforms:
  - name: homelab-test-pterodactyl
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    # Join the groups whose group_vars the phases need, without running
    # their reboot-y phases. `pterodactyl` is the one that matters:
    # it carries the images, the *_dir paths, the port and APP_URL.
    groups:
      - init
      - docker
      - pterodactyl

provisioner:
  name: ansible
  config_options:
    defaults:
      collections_path: /ansible/collections
      stdout_callback: yaml
      # Molecule generates its OWN ansible.cfg and points ANSIBLE_CONFIG
      # at it, so nothing from the repo's ansible.cfg carries over —
      # including vault_password_file. The inventory links in the real
      # group_vars/, which contains the encrypted all/vault.yml, so
      # without this every molecule action (destroy included) dies at
      # "Attempting to decrypt but no vault secrets found" before a
      # single task runs. Same path ansible.cfg uses: the compose
      # secret mounted into the runner.
      vault_password_file: /run/secrets/vault_pass
  # debian-pterodactyl-panel.yml tags its `docker compose up` task
  # molecule-notest: overlay2 can't mount inside a Docker-in-Docker
  # target. Rendering the compose file is the point here, not running
  # the panel.
  options:
    skip-tags: molecule-notest
    # The phase asserts both database passwords are set, and on a real
    # deploy they come from the vault. Dummies keep this scenario
    # self-contained — it tests the template, and shouldn't need the
    # real credentials to do it.
    #
    # extra-vars rather than inventory host_vars: the inventory's
    # group_vars is a symlink to the repo's, so there's no ephemeral
    # dir to drop a var file into, and molecule's inline host_vars
    # didn't reach the play. extra-vars outrank everything and apply to
    # converge AND verify, which also needs them to assert the
    # passwords reached the rendered file.
    extra-vars: "pterodactyl_db_password=molecule-dummy-db-pw pterodactyl_db_root_password=molecule-dummy-root-pw"
  inventory:
    links:
      group_vars: /ansible/group_vars

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
