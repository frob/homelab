---
# Baseline phases the Jellyfin phase assumes (a user to own the dirs,
# Docker installed), then the phase under test. Same container-safe
# exclusions as the default scenario: no init/network/gpu/wings.

- import_playbook: ../../playbooks/debian-basic.yml
  vars:
    target_hosts: all

- import_playbook: ../../playbooks/debian-docker.yml
  vars:
    target_hosts: all

- import_playbook: ../../playbooks/debian-jellyfin.yml
  vars:
    target_hosts: all
