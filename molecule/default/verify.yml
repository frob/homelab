---
# Post-converge assertions. Keep these cheap and focused on the
# observable end state, not the steps that produced it — re-running
# converge already proves idempotence.

- name: Verify baseline state
  hosts: all
  gather_facts: false
  tasks:
    - name: Docker engine is installed and the daemon socket exists
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: docker_sock

    - name: Assert docker socket present
      ansible.builtin.assert:
        that: docker_sock.stat.exists
        fail_msg: "Docker daemon socket missing — debian-docker.yml didn't take."

    - name: Portainer Agent compose file rendered
      ansible.builtin.stat:
        path: /opt/portainer-agent/docker-compose.yml
      register: portainer_compose

    - name: Assert portainer agent compose rendered
      ansible.builtin.assert:
        that: portainer_compose.stat.exists
        fail_msg: "Portainer Agent compose file missing."

    - name: Cockpit socket unit is enabled
      ansible.builtin.command: systemctl is-enabled cockpit.socket
      register: cockpit_enabled
      changed_when: false
      failed_when: cockpit_enabled.rc != 0
