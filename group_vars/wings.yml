---
# Group vars for Pterodactyl Wings hosts. The baseline + debian-wings.yml
# phase installs the wings binary, creates /etc/pterodactyl, and
# registers a systemd unit. The actual node config (config.yml) is
# generated by the Pterodactyl panel and dropped on the host out-of-band
# — Ansible does not manage it.
#
# Host-identity vars (host_name, network_*) are per-host — put them in
# host_vars/<host>.yml.

# Wings release. `latest` pulls the most recent GitHub release at deploy
# time; pin to a tag (e.g. `v1.11.13`) for reproducibility.
wings_version: latest

# Ports opened in ufw. 8080/tcp is the panel→wings API; 2022/tcp is the
# Wings SFTP server players' file managers connect to.
wings_api_port: 8080
wings_sftp_port: 2022
