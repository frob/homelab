---
# Per-bootstrap values for the host currently in [init]. Because init is
# one-host-at-a-time, these live in group_vars (not host_vars) and are
# edited before each new-host run.

# Hostname (set during basic phase, also used in banners + /etc/hosts).
host_name: util1

# Network — static IP via ifupdown. Applied during network phase; takes
# effect on next reboot. The host's current DHCP IP is what's in
# inventory under [init].
network_interface: ens18
network_address: 192.168.1.50
network_netmask: 255.255.255.0
network_cidr: 24
network_gateway: 192.168.1.1
network_dns:
  - 192.168.1.1
