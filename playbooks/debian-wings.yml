## Pterodactyl Wings on Debian 13 (Trixie).
##
## Installs the wings daemon, creates /etc/pterodactyl, registers a
## systemd unit, and opens the SFTP + API ports. Assumes:
##   - debian-docker.yml has already installed Docker (Wings runs game
##     servers as Docker containers).
##
## The node config (/etc/pterodactyl/config.yml) is generated by the
## Pterodactyl panel when the node is created and pasted onto the host
## out-of-band — Ansible does NOT manage that file. Until it exists,
## wings will fail to start; that's expected.
---
- name: Install Pterodactyl Wings
  hosts: "{{ target_hosts | default('wings') }}"
  become: true
  handlers:
    - name: restart wings
      ansible.builtin.systemd_service:
        name: wings
        state: restarted
        daemon_reload: true

  tasks:
    - name: Ensure /etc/pterodactyl exists
      ansible.builtin.file:
        path: /etc/pterodactyl
        state: directory
        mode: "0700"

    # The release naming maps Debian arch (amd64/arm64) to the Wings
    # binary name (wings_linux_amd64 / wings_linux_arm64).
    - name: Map dpkg architecture to wings asset suffix
      ansible.builtin.set_fact:
        wings_arch: >-
          {{
            {'amd64': 'amd64',
             'arm64': 'arm64'}[ansible_architecture | replace('x86_64','amd64') | replace('aarch64','arm64')]
          }}

    - name: Resolve wings release URL
      ansible.builtin.set_fact:
        wings_url: >-
          {{
            'https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_' ~ wings_arch
            if wings_version == 'latest'
            else 'https://github.com/pterodactyl/wings/releases/download/' ~ wings_version ~ '/wings_linux_' ~ wings_arch
          }}

    - name: Install wings binary
      ansible.builtin.get_url:
        url: "{{ wings_url }}"
        dest: /usr/local/bin/wings
        mode: "0755"
        force: "{{ wings_version == 'latest' }}"
      notify: restart wings

    - name: Install wings systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/wings.service
        mode: "0644"
        content: |
          [Unit]
          Description=Pterodactyl Wings Daemon
          After=docker.service
          Requires=docker.service
          PartOf=docker.service

          [Service]
          User=root
          WorkingDirectory=/etc/pterodactyl
          LimitNOFILE=4096
          PIDFile=/var/run/wings/daemon.pid
          ExecStart=/usr/local/bin/wings
          Restart=on-failure
          StartLimitInterval=600

          [Install]
          WantedBy=multi-user.target
      notify: restart wings

    # Enable but don't start — wings will fail until config.yml exists.
    # Once you create the node in the panel and paste its config into
    # /etc/pterodactyl/config.yml, `systemctl start wings` brings it up.
    - name: Enable wings service
      ansible.builtin.systemd_service:
        name: wings
        enabled: true
        daemon_reload: true

    - name: Allow Wings API port through ufw
      community.general.ufw:
        rule: allow
        to_port: "{{ wings_api_port }}"
        proto: tcp
        state: enabled

    - name: Allow Wings SFTP port through ufw
      community.general.ufw:
        rule: allow
        to_port: "{{ wings_sftp_port }}"
        proto: tcp
        state: enabled
