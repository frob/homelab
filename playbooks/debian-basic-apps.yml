## Install the basic applications
---
- name: Install and Configure Basic Applications
  hosts: "*"
  become: true
  tasks:
    - name: "Uninstall pre-installed basic Apps"
      with_items:
        - firefox-esr
      apt:
        name: "{{ item }}"
        state: absent
        update_cache: yes

    - name: "Install Extrepo"
      with_items:
        - extrepo
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes

    - name: "Enable librawolf on Extrepo"
      become: true
      ansible.builtin.command: extrepo enable librewolf

    - name: "Install Extrepo"
      with_items:
        - yakuake
        - librewolf
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
