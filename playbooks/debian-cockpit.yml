---
- name: Install and configure Cockpit
  hosts: "{{ target_hosts | default('init') }}"
  become: true
  tasks:
    - name: Install Cockpit
      ansible.builtin.apt:
        name: cockpit
        state: present
        update_cache: yes
      check_mode: false

    - name: Enable & start Cockpit socket
      ansible.builtin.systemd_service:
        name: cockpit.socket
        state: started
        enabled: true

    - name: Allow Cockpit (9090/tcp) through ufw
      community.general.ufw:
        rule: allow
        port: "9090"
        proto: tcp
        state: enabled
