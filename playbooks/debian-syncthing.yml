## Setup Syncthing
---
- name: Install and Configure Syncthing
  hosts: "*"
  become: true
  tasks:
    # This will be the new way with ansible 2.15
    # - name: Add Syncthing repo using key from URL.
    #   ansible.builtin.deb822_repository:
    #     name: syncthing
    #     types: [deb]
    #     uris: "https://apt.syncthing.net/"
    #     components: [binary]
    #     signed_by: https://syncthing.net/release-key.txt
    #     state: present
    #     enabled: true

    - name: Add syncthing apt repo key
      become: true
      ansible.builtin.get_url:
        url: https://syncthing.net/release-key.txt
        dest: /etc/apt/trusted.gpg.d/syncthing.asc
        mode: "0644"
        force: true

    - name: Add syncthing apt repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb https://apt.syncthing.net/ syncthing stable"
        state: present

    - name: "Install Syncthing"
      with_items:
        - apt-transport-https
        - syncthing
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes

    - name: Enable and Start Syncthing as a service
      ansible.builtin.systemd_service:
        name: syncthing@frob
        state: started
        enabled: true

    - name: Configure Firewall for Syncthing
      with_items:
        - 22000
        - 8384
      community.general.ufw:
        rule: allow
        # name: syncthing
        port: "{{ item }}"
        proto: tcp
        state: enabled
