## Deploy Portainer Agent on a Docker host so the central Portainer
## server can manage it as a remote endpoint (added via the Portainer
## UI: Environments > Add environment > Agent, pointing at
## <host>:{{ portainer_agent_port }}).
---
- name: Install Portainer Agent
  hosts: "{{ target_hosts | default('init') }}"
  become: true
  tasks:
    - name: Ensure portainer agent compose dir exists
      ansible.builtin.file:
        path: "{{ portainer_agent_compose_dir }}"
        state: directory
        mode: "0755"
      check_mode: false

    - name: Render Portainer Agent docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ portainer_agent_compose_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          ---
          services:
            portainer-agent:
              image: {{ portainer_agent_image }}
              container_name: portainer-agent
              restart: always
              ports:
                - "{{ portainer_agent_port }}:9001"
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - /var/lib/docker/volumes:/var/lib/docker/volumes
                - /:/host
      check_mode: false

    # Launching a real container requires overlay2, which can't mount
    # inside a Docker-in-Docker target (overlay-on-overlay → "invalid
    # argument"). Skipped under Molecule; verify.yml only asserts the
    # compose file rendered. Inert tag on real hosts.
    - name: Bring up Portainer Agent stack
      community.docker.docker_compose_v2:
        project_src: "{{ portainer_agent_compose_dir }}"
        state: present
      when: not ansible_check_mode
      tags: molecule-notest

    - name: Allow Portainer Agent port through ufw
      community.general.ufw:
        rule: allow
        to_port: "{{ portainer_agent_port }}"
        proto: tcp
        state: enabled
