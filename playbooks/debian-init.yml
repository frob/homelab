## Initial APT setup for Debian 13 (Trixie) servers.
---
- name: Set the APT Sources
  hosts: init
  become: true
  tasks:
    - name: Comment out any CD-ROM source in /etc/apt/sources.list (legacy layout)
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '^(deb\s+cdrom:.*)$'
        replace: '# \1'
      failed_when: false

    - name: Remove CD-ROM URI from deb822 sources (Trixie default layout)
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/debian.sources
        regexp: '^URIs:\s*cdrom:.*$'
        state: absent
      failed_when: false

- name: Update the servers
  hosts: init
  become: true
  tasks:
    - name: Update apt cache & upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600
