## Install Docker CE on Debian 13 (Trixie).
---
- name: Install and Configure Docker
  hosts: "{{ target_hosts | default('init') }}"
  become: true
  handlers:
    - name: restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          # Required by the deb822_repository module below; not present
          # on a fresh Debian 13 install unless something else pulls it.
          - python3-debian
        state: present
        update_cache: yes

    # Trixie ships with deb822-format sources and no apt-key. Use the
    # deb822_repository module — it downloads the signing key itself
    # and writes /etc/apt/sources.list.d/docker.sources.
    - name: Add Docker apt repository (deb822)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        suites: "{{ ansible_distribution_release }}"
        components: stable
        signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        state: present
        enabled: true
      check_mode: false

    - name: Refresh apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: yes
      check_mode: false

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      check_mode: false

    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Write Docker daemon config (log rotation + data-root)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "data-root": "{{ docker_data_root }}",
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "{{ docker_log_max_size }}",
              "max-file": "{{ docker_log_max_file }}"
            }
          }
      notify: restart docker

    - name: Enable & start docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: docker
        append: true
